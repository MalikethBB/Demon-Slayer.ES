# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
name: Java CI with Maven

permissions:
  contents: write
  security-events: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven

      # Build project
      - name: Build with Maven
        run: mvn -B -U package --file demonslayer/pom.xml

      # Lint and Static Analysis
      - name: Lint and Static Analysis
        run: mvn -B -U clean verify checkstyle:check spotbugs:check --file demonslayer/pom.xml

      # Generate Lint Report
      - name: Generate Lint Report
        run: mvn checkstyle:checkstyle spotbugs:spotbugs --file demonslayer/pom.xml

      # Upload Lint Report
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            demonslayer/target/reports/checkstyle.html
            demonslayer/target/spotbugs/spotbugs.html

      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8
        with:
          directory: demonslayer

      # Build and generate Javadoc
      - name: Build and generate Javadoc
        run: mvn -B -U clean verify javadoc:javadoc --file demonslayer/pom.xml

      # Upload Javadoc artifact
      - name: Upload Javadoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: demonslayer/target/reports/apidocs
